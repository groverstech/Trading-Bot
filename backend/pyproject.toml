[project]
name = "grokbot"
version = "1.0.0"
description = "Grok Bot Terminal - autonomous six-agent Binance Spot + USD-M Futures trading system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "cryptography>=42",
  "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["safety: critical safety tests required before live readiness"]
